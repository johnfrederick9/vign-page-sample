<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Sign In | VIGN USA</title>
    <link rel="icon" href="../images/vign-mark-64.png" type="image/png">
    <link rel="stylesheet" href="../vendors/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/vign.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="adm">
<!-- SMK admin/login.php: admin sign in -->
<div class="alogin">
    <div class="alogin-box">
        <a href="../index.html" class="brand" style="margin-bottom:18px"><img class="brand-full" src="../images/vign-logo-full.png" alt="VignUSA.com, Verity Insight Group Network" width="900" height="214"></a>
        <h1 style="font-size:1.6rem;margin-bottom:4px">Admin Sign In</h1>
        <p class="muted">For VIGN administrators only.</p>
        <form class="form" id="f" style="margin-top:16px" autocomplete="off">
            <label>Email <input type="text" name="u" maxlength="150"></label>
            <label>Password <input type="password" name="p" maxlength="200"></label>
            <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <p class="alert" style="margin-top:16px">Preview: no password needed. Click <b>Sign In</b> to open the sample Admin Menu.</p>
        <p class="center small" style="margin-top:12px"><a href="../index.html">← Back to website</a></p>
    </div>
</div>
<script>
var qs = new URLSearchParams(location.search);
if (qs.get('out')) { try { sessionStorage.removeItem('vign-role'); } catch (e) {} }
document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault(); try { sessionStorage.setItem('vign-role', 'admin'); } catch (er) {}
    var to = (qs.get('to') || '').replace(/[^a-z0-9-]/gi, '');
    location.href = 'index.html' + (to ? '#' + to : '');
});
</script>
</body>
</html>
