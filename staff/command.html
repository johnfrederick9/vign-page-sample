<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home | VIGN Staff Office</title>
    <link rel="icon" href="../images/vign-logo.png" type="image/png">
    <link rel="stylesheet" href="../vendors/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/vign.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/staff.css">
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/link.js" defer></script>
</head>
<body class="ps st" data-page="home">
<main class="content" id="app"></main>
<script>
/* SMK command.php + index_flow.php (Flow "Overview"): Today strip, Activity last 30 days, Due pipeline,
   Money, Receivables by age. Every number and every bar opens the matching Jobs / Accounting list. */
var VS = window.VS = window.VS || {};
VS.init = function () {
    var V = VS, J = V.jobs, h = new Date().getHours();
    var on = function (k, d) { return J.filter(function (j) { return j[k] === d; }).length; };
    var dueNow = J.filter(function (j) { return V.open(j) && j.due <= 0; }).length;
    var trend = function (t, y) { return t > y ? '<em class="up">▲ ' + (t - y) + ' vs yesterday</em>' : t < y ? '<em class="down">▼ ' + (y - t) + ' vs yesterday</em>' : '<em class="flat">same as yesterday</em>'; };

    var html = V.band('fa-house', 'Home', 'Good ' + (h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening') + ', ' + V.esc(V.me.name.split(' ')[0]) + '. Every number opens its list.',
        '<a class="bbtn" href="flowimport.html"><i class="fa-solid fa-file-import"></i> Import jobs</a><a class="bbtn solid" href="flowreview.html"><i class="fa-solid fa-list-check"></i> Review reports</a>');

    html += '<div class="today">' +
        '<a href="flowjobs.html?dtype=created&min=' + V.iso(0) + '&max=' + V.iso(0) + '"><span>Jobs created today</span><b>' + on('created', 0) + '</b>' + trend(on('created', 0), on('created', -1)) + '</a>' +
        '<a href="flowreview.html"><span>Reports sent in today</span><b>' + on('sent', 0) + '</b>' + trend(on('sent', 0), on('sent', -1)) + '</a>' +
        '<a href="flowjobs.html?view=delivered"><span>Delivered to clients today</span><b>' + on('reviewed', 0) + '</b>' + trend(on('reviewed', 0), on('reviewed', -1)) + '</a>' +
        '<a href="flowjobs.html?view=late"><span>Due today + overdue</span><b style="color:var(--r)">' + dueNow + '</b><em class="flat">' + J.filter(V.late).length + ' overdue</em></a></div>';

    // Activity, last 30 days: created + delivered (bars), reports sent in (line)
    var days = []; for (var d = -29; d <= 0; d++) days.push(d);
    var c1 = days.map(function (d) { return on('created', d); }), c2 = days.map(function (d) { return on('reviewed', d); }), c3 = days.map(function (d) { return on('sent', d); });
    // chart: one count axis; Created + Delivered = paired bars, Reports sent in = line. Hover a day = all 3 numbers
    var sum = function (a) { return a.reduce(function (t, v) { return t + v; }, 0); };
    var top = Math.max(3, Math.max.apply(null, c1.concat(c2, c3)));
    var step = top <= 4 ? 1 : top <= 8 ? 2 : Math.ceil(top / 4), ymax = step * Math.ceil(top / step);
    var W = 560, H = 250, L = 28, R = 6, T = 12, B = 26, base = H - B, bw = (W - L - R) / 30;
    var y = function (v) { return base - (v / ymax) * (base - T); };
    var cx = function (i) { return L + i * bw + bw / 2; };
    var gw = Math.min(18, bw * .72), w1 = (gw - 2) / 2; // 2px gap between the two bars
    var bar = function (x, v, cls) { if (!v) return ''; var t = y(v), r = Math.min(4, w1 / 2, base - t); return '<path class="' + cls + '" d="M' + x + ',' + base + 'V' + (t + r) + 'Q' + x + ',' + t + ' ' + (x + r) + ',' + t + 'H' + (x + w1 - r) + 'Q' + (x + w1) + ',' + t + ' ' + (x + w1) + ',' + (t + r) + 'V' + base + 'Z"/>'; };
    var svg = '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Activity, last 30 days: ' + sum(c1) + ' jobs created, ' + sum(c3) + ' reports sent in, ' + sum(c2) + ' delivered. Daily numbers are in the table below.">';
    svg += '<rect class="band" id="cBand" x="0" y="' + T + '" width="' + bw + '" height="' + (base - T) + '" rx="6" style="display:none"/>';
    for (var g = step; g <= ymax; g += step) svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '"/><text x="' + (L - 8) + '" y="' + (y(g) + 3.5) + '" text-anchor="end">' + g + '</text>';
    svg += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + base + '" y2="' + base + '"/><text x="' + (L - 8) + '" y="' + (base + 3.5) + '" text-anchor="end">0</text>';
    days.forEach(function (d, i) {
        var x0 = cx(i) - gw / 2;
        svg += bar(x0, c1[i], 'bar1') + bar(x0 + w1 + 2, c2[i], 'bar2');
        if ((29 - i) % 7 === 0) svg += '<text x="' + cx(i) + '" y="' + (H - 7) + '" text-anchor="' + (i === 29 ? 'end' : 'middle') + '"' + (i === 29 ? ' dx="' + (bw / 2) + '"' : '') + '>' + (d === 0 ? 'Today' : V.dayShort(d)) + '</text>';
    });
    svg += '<polyline class="line" points="' + c3.map(function (v, i) { return cx(i) + ',' + y(v); }).join(' ') + '"/>';
    svg += '<circle class="dot" id="cDot" r="4.5" style="display:none"/>';
    // the hit target is the whole day column (bigger than the bars)
    days.forEach(function (d, i) { svg += '<rect class="hit" data-i="' + i + '" x="' + (L + i * bw) + '" y="' + T + '" width="' + bw + '" height="' + (base - T) + '"/>'; });
    svg += '</svg><div class="ctip" id="cTip" role="status" aria-live="polite"></div></div>';
    var key = '<div class="ckey"><span><i class="sw1"></i>Created <b>' + sum(c1) + '</b></span><span><i class="sw3"></i>Reports sent in <b>' + sum(c3) + '</b></span><span><i class="sw2"></i>Delivered <b>' + sum(c2) + '</b></span><span class="muted">30-day totals · hover a day for its numbers · click it for the jobs</span></div>';
    var table = '<details class="cdet"><summary>Daily numbers (table)</summary><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Day</th><th class="r">Created</th><th class="r">Reports sent in</th><th class="r">Delivered</th></tr></thead><tbody>' +
        days.slice().reverse().map(function (d) { var i = d + 29; return '<tr><td>' + (d === 0 ? 'Today' : V.dayShort(d)) + '</td><td class="r">' + c1[i] + '</td><td class="r">' + c3[i] + '</td><td class="r">' + c2[i] + '</td></tr>'; }).join('') + '</tbody></table></div></details>';
    svg = key + svg + table;

    // Due pipeline
    var openJ = J.filter(V.open), cnt = function (f) { return openJ.filter(f).length; };
    var pipe = '<div class="pipe">' +
        '<a class="late" href="flowjobs.html?view=late"><b>' + cnt(function (j) { return j.due < 0; }) + '</b><span>Overdue</span></a>' +
        '<a class="now" href="flowjobs.html?dtype=due&min=' + V.iso(0) + '&max=' + V.iso(0) + '"><b>' + cnt(function (j) { return j.due === 0; }) + '</b><span>Due today</span></a>' +
        '<a href="flowjobs.html?dtype=due&min=' + V.iso(1) + '&max=' + V.iso(1) + '"><b>' + cnt(function (j) { return j.due === 1; }) + '</b><span>Tomorrow</span></a>' +
        '<a href="flowjobs.html?dtype=due&min=' + V.iso(2) + '&max=' + V.iso(7) + '"><b>' + cnt(function (j) { return j.due >= 2 && j.due <= 7; }) + '</b><span>Next 7 days</span></a>' +
        '<a href="flowjobs.html?dtype=due&min=' + V.iso(8) + '"><b>' + cnt(function (j) { return j.due > 7; }) + '</b><span>Later</span></a></div>' +
        '<p class="muted small" style="margin:12px 0 0"><b class="unassigned">' + cnt(function (j) { return !j.ins; }) + ' open jobs have no inspector yet.</b> <a href="flowjobs.html?view=unassigned">Assign them</a></p>';

    // Receivables by age (invoiced, not paid)
    var owed = V.invoices.filter(function (i) { return V.invBal(i) > 0; }), bsum = function (a) { return a.reduce(function (t, i) { return t + V.invBal(i); }, 0); };
    var buckets = [['0–30 days', 0, 30, 'var(--g)'], ['31–60 days', 31, 60, 'var(--a)'], ['61–90 days', 61, 90, 'var(--o)'], ['Over 90', 91, 9999, 'var(--r)']];
    var tot = bsum(owed) || 1;
    var aging = '<div class="aging">' + buckets.map(function (b) {
        var v = bsum(owed.filter(function (i) { var a = -i.billed; return a >= b[1] && a <= b[2]; }));
        return '<a href="flowinvoices.html?mode=balance"><span>' + b[0] + '</span><span class="barbg"><i style="width:' + Math.round(v / tot * 100) + '%;background:' + b[3] + '"></i></span><span class="r">' + V.money(v) + '</span></a>';
    }).join('') + '</div><p class="muted small" style="margin:12px 0 0">Total owed by clients: <b>' + V.money(bsum(owed)) + '</b> · <a href="flowinvoices.html?mode=bycustomer">Aging by client</a></p>';

    // Periods table (SMK keeps the numbers as a table under the charts)
    var per = [['Today', 0, 0], ['Yesterday', -1, -1], ['Last 7 days', -6, 0], ['Last 30 days', -29, 0]];
    var inR = function (k, a, b) { return J.filter(function (j) { return j[k] != null && j[k] >= a && j[k] <= b; }); };
    var ptab = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Period</th><th class="r">Created</th><th class="r">Reports in</th><th class="r">Delivered</th><th class="r">Invoiced</th><th class="r">Paid</th></tr></thead><tbody>' +
        per.map(function (p) { return '<tr><td><b>' + p[0] + '</b></td><td class="r">' + inR('created', p[1], p[2]).length + '</td><td class="r">' + inR('sent', p[1], p[2]).length + '</td><td class="r">' + inR('reviewed', p[1], p[2]).length + '</td><td class="r">' + V.money(V.sum(inR('invDate', p[1], p[2]))) + '</td><td class="r">' + V.money(V.sum(inR('payDate', p[1], p[2]))) + '</td></tr>'; }).join('') +
        '</tbody></table></div>';

    html += '<div class="grid2"><div>' +
        V.card('Activity, last 30 days', '<a href="flowjobs.html">All jobs</a>', svg, false) +
        V.card('Periods', 'Same numbers as a table', ptab, true) +
        '</div><div>' +
        V.card('Due pipeline', 'Open jobs by due date', pipe) +
        (V.can('billing') ? V.card('Receivables by age', 'Invoiced, not paid', aging) : '') +
        V.card('Alerts', V.alerts.length + ' new', '<ul class="alerts">' + V.alerts.map(function (a) {
            var href = a[3] === 'chase' ? 'flowjobs.html?view=late' : a[3] === 'review' ? 'flowreview.html' : 'flowimport.html';
            return '<li><span class="ic ' + a[0] + '" style="display:grid;place-items:center"><i class="fa-solid ' + a[1] + '"></i></span><span><a href="' + href + '">' + V.esc(a[2]) + '</a></span></li>';
        }).join('') + '</ul>', true) +
        '</div></div>';
    V.$('#app').innerHTML = html;
    // legend for the chart
    // hover / tap a day: highlight it and show all three numbers; click: that day's jobs
    var tip = V.$('#cTip'), band = V.$('#cBand'), dot = V.$('#cDot'), chart = V.$('.chart'), wrap = V.$('.chart-wrap');
    var row = function (cls, n, label) { var p = document.createElement('div'), i = document.createElement('i'), b = document.createElement('b'); i.className = cls; b.textContent = n; p.appendChild(i); p.appendChild(b); p.appendChild(document.createTextNode(' ' + label)); return p; };
    var showDay = function (i) {
        band.setAttribute('x', L + i * bw); band.style.display = '';
        dot.setAttribute('cx', cx(i)); dot.setAttribute('cy', y(c3[i])); dot.style.display = '';
        tip.textContent = '';
        var h = document.createElement('div'); h.className = 'ctip-h'; h.textContent = days[i] === 0 ? 'Today' : V.date(days[i]).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        tip.appendChild(h); tip.appendChild(row('sw1', c1[i], 'created')); tip.appendChild(row('sw3', c3[i], 'reports sent in')); tip.appendChild(row('sw2', c2[i], 'delivered'));
        var sx = chart.getBoundingClientRect().width / W, px = cx(i) * sx, tw = tip.offsetWidth || 150, ww = wrap.clientWidth;
        tip.style.left = Math.max(0, Math.min(ww - tw, px > ww / 2 ? px - tw - 14 : px + 14)) + 'px';
        tip.classList.add('on');
    };
    var hide = function () { tip.classList.remove('on'); band.style.display = 'none'; dot.style.display = 'none'; };
    V.$$('.chart .hit').forEach(function (r) {
        var i = +r.dataset.i;
        r.addEventListener('pointerenter', function () { showDay(i); });
        r.addEventListener('click', function () { location.href = 'flowjobs.html?dtype=created&min=' + V.iso(days[i]) + '&max=' + V.iso(days[i]); });
    });
    chart.addEventListener('pointerleave', hide);
};
</script>
</body>
</html>
