<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fill in the form | VIGN Staff Office</title>
    <link rel="icon" href="../images/vign-logo.png" type="image/png">
    <link rel="stylesheet" href="../vendors/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/vign.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/staff.css">
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/link.js" defer></script>
</head>
<body class="ps st" data-page="jobdetail">
<main class="content" id="app"></main>
<script>
/* R-02: staff can complete an inspection form by hand, for example when an inspector phones in
   the results or sends a paper form. Same form, same 1-4 / N/O / N/A ratings, same checks as the phone. */
var VS = window.VS = window.VS || {};
VS.init = function () {
    var V = VS, j = V.job(V.param('job'));
    if (!j) { var pick = V.jobs.filter(function (x) { return x.status === 'assigned' || x.status === 'in_field' || x.status === 'returned'; })[0]; j = pick; }
    var c = V.client(j.client), ins = j.ins ? V.ins(j.ins) : null, form = V.forms[j.form], R = ['1', '2', '3', '4', 'NO', 'NA'];
    var html = V.band('fa-pen-to-square', 'Fill in the form by hand', 'Job ' + j.id + ' · ' + V.esc(j.addr) + ', ' + V.esc(j.city) + ' · ' + V.esc(c.name),
        '<a class="bbtn" href="flowjob.html?job=' + j.id + '"><i class="fa-solid fa-arrow-left"></i> Back to the job</a>');
    html += '<p class="note2" style="margin-top:16px"><i class="fa-solid fa-circle-info"></i> Use this when an inspector phones in the results or sends a paper form. The report is marked <b>"entered by staff"</b> and goes to Review like any other.</p>';
    html += '<form id="ff"><div class="grid2"><div>' + V.card(V.esc(form[0]), form[1].length + ' items · 1 Good · 2 Minor · 3 Repair · 4 Urgent', '<ol class="ffl">' + form[1].map(function (it, i) {
        var a = j.answers ? j.answers[i] : '';
        return '<li><div class="ffq">' + V.esc(it) + '</div><div class="ffr" role="radiogroup" aria-label="' + V.esc(it) + '">' + R.map(function (r) { return '<label class="' + V.ratings[r][1] + '"><input type="radio" name="a' + i + '" value="' + r + '"' + (a === r ? ' checked' : '') + '><span>' + (r.length > 1 ? V.ratings[r][0] : r) + '</span></label>'; }).join('') + '</div>' +
            '<input type="text" class="ffn" name="n' + i + '" placeholder="Note (needed for 3 or 4)" value="' + V.esc(j.findings ? j.findings[i] : '') + '"></li>';
    }).join('') + '</ol>', true) + '</div><div>' +
        V.card('Who did the visit', '', '<label class="fld">Inspector<select name="who">' + V.inspectors.filter(function (i) { return i.active; }).map(function (i) { return '<option value="' + i.id + '"' + (ins && ins.id === i.id ? ' selected' : '') + '>' + V.esc(i.name) + '</option>'; }).join('') + '</select></label>' +
            '<label class="fld">Visit date<input type="date" name="day" value="' + V.iso(0) + '"></label><label class="fld">How we got the results<select name="how"><option>Phoned in</option><option>Paper form (scanned)</option><option>Email</option></select></label>') +
        V.card('Photos', '', '<label class="fld">Add the photos the inspector sent<input type="file" name="ph" accept="image/*" multiple></label><p class="muted small" style="margin:0">Items rated 3 or 4 need a photo.</p>') +
        V.card('Score', '<span class="samp">sample formula</span>', '<div class="ffscore"><b id="sc">–</b><span id="sct">Rate the items to see the score.</span></div>') +
        '<div class="form-foot"><button type="button" class="btn btn-ghost" id="draft">Save draft</button><button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i> Send to Review</button></div>' +
        '</div></div></form><div id="done"></div>';
    V.$('#app').innerHTML = html;
    var f = V.$('#ff');
    function vals() { return form[1].map(function (x, i) { var r = f.querySelector('[name=a' + i + ']:checked'); return r ? r.value : ''; }); }
    function score() { var a = vals(), t = 0, n = 0; a.forEach(function (x) { if (V.points[x] != null) { t += V.points[x]; n++; } }); var s = n ? Math.round(t / n) : null; V.$('#sc').textContent = s == null ? '–' : s; V.$('#sc').className = s == null ? '' : 'rate ' + V.scoreCls(s); V.$('#sct').textContent = a.filter(Boolean).length + ' of ' + a.length + ' rated'; return s; }
    f.addEventListener('change', score); score();
    V.$('#draft').addEventListener('click', function () { V.toast('Draft saved (preview only).'); });
    f.addEventListener('submit', function (e) {
        e.preventDefault();
        var a = vals(), miss = a.filter(function (x) { return !x; }).length, noNote = a.filter(function (x, i) { return (x === '3' || x === '4') && !f.querySelector('[name=n' + i + ']').value.trim(); }).length;
        if (miss) { V.toast(miss + ' item(s) not rated yet.'); return; }
        if (noNote) { V.toast(noNote + ' item(s) rated 3 or 4 need a note.'); return; }
        var s = score(), who = V.ins(f.who.value);
        j.answers = a; j.findings = a.map(function (x, i) { return f.querySelector('[name=n' + i + ']').value.trim(); }); j.ins = who.id; j.sent = 0; j.status = 'submitted'; j.byStaff = f.how.value;
        f.style.display = 'none';
        V.$('#done').innerHTML = V.card('<i class="fa-solid fa-circle-check" style="color:var(--g)"></i> Sent to Review', '', '<p style="margin:0">Job <b>' + j.id + '</b> · ' + V.esc(form[0]) + ' · score <b>' + s + '</b> <span class="samp">sample</span><br>Visit by ' + V.esc(who.name) + ' · ' + V.esc(f.how.value) + ' · entered by staff</p><p class="note1"><i class="fa-solid fa-circle-info"></i>Preview only: nothing was saved. In the real system it is now in Review, marked "entered by staff".</p><div class="acts1" style="margin-top:12px"><a class="btn btn-primary" href="flowreview.html">Go to Review</a><a class="btn btn-ghost" href="flowjob.html?job=' + j.id + '">Back to the job</a></div>');
    });
};
</script>
</body>
</html>
