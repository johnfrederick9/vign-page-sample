<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload Photo | VIGN Inspector Portal</title>
    <link rel="icon" href="../images/vign-mark-64.png" type="image/png">
    <link rel="stylesheet" href="../vendors/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="../css/vign.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="../js/vign-forms.js" defer></script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/link.js" defer></script>
</head>
<body class="ps" data-page="upload">
<main class="content" id="app"></main>
<script>
// SMK ps/uploadphoto.php: Manual Photo Upload.
// Step 1: Select Job(s) · Step 2: Select Address · Step 3: Upload Photo (type, date, time, quick select, notes).
// VIGN: Step 2 picks the checklist item the photo belongs to.
var VIGN = window.VIGN = window.VIGN || {};
VIGN.init = function () {
    var V = VIGN, pre = V.param('job');
    var jobs = V.jobs.filter(function (j) { return V.isOpen(j) || j.status === 'returned'; });
    var html = V.band('fa-camera', 'Upload Photo', 'Add photos to a job after you leave the site, or if the camera did not work in the form.');
    html += '<div class="steps3">';
    html += '<div class="card2"><div class="card2-h stephead"><b>1</b><h3>Select job(s)</h3></div><div class="card2-b"><div class="pick">' +
        jobs.map(function (j) { return '<label><input type="checkbox" name="job" value="' + j.id + '"' + (j.id === pre ? ' checked' : '') + '><span><b>' + j.id + '</b> · ' + V.esc(j.addr) + '<small>' + V.esc(j.city) + ' · ' + V.status[j.status][0] + '</small></span></label>'; }).join('') +
        '</div></div></div>';
    html += '<div class="card2"><div class="card2-h stephead"><b>2</b><h3>Select checklist item</h3></div><div class="card2-b"><p class="muted small" id="s2help" style="margin:0 0 10px"></p><div class="pick" id="items"></div></div></div>';
    html += '<div class="card2"><div class="card2-h stephead"><b>3</b><h3>Upload photo</h3></div><div class="card2-b">' + V.noPeople() +
        '<label class="drop"><i class="fa-solid fa-cloud-arrow-up"></i><b>Choose from files</b> or take a photo<input type="file" accept="image/*" multiple id="file"></label>' +
        '<div class="thumbs" id="thumbs" style="margin-top:10px"></div>' +
        '<div class="fld">Type<div class="chooser"><label><input type="radio" name="type" value="Finding" checked>Finding</label><label><input type="radio" name="type" value="General">General / exterior</label><label><input type="radio" name="type" value="Receipt">Receipt</label></div></div>' +
        '<div class="fld-row"><label class="fld">Date<input type="date" id="pd"></label><label class="fld">Time<input type="time" id="pt"></label></div>' +
        '<label class="fld">Quick select<select id="qs"><option value="">-- Select to add --</option><option>Front of property, house number visible</option><option>Damage close-up</option><option>Wide shot of the area</option><option>Store entrance and signage</option><option>Receipt for reimbursement</option></select></label>' +
        '<label class="fld">Photo notes<textarea id="pn" placeholder="What does this photo show?"></textarea></label>' +
        '<p class="alert" id="msg" hidden style="margin-top:12px"></p>' +
        '<div class="nav2"><button class="btn btn-ghost" id="clr">Clear selection</button><button class="btn btn-primary" id="sub"><i class="fa-solid fa-upload"></i> Submit</button></div></div></div>';
    html += '</div>';
    document.getElementById('app').innerHTML = html;

    var now = new Date(), pad = function (n) { return (n < 10 ? '0' : '') + n; };
    document.getElementById('pd').value = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    document.getElementById('pt').value = pad(now.getHours()) + ':' + pad(now.getMinutes());
    var files = [];
    function sel() { return V.$$('input[name=job]:checked').map(function (c) { return c.value; }); }
    function step2() {
        var s = sel(), box = document.getElementById('items'), help = document.getElementById('s2help');
        if (s.length !== 1) { box.innerHTML = ''; help.textContent = s.length ? 'Several jobs selected: the photo is added to each one as a general photo.' : 'Choose one job to see its checklist.'; return; }
        var f = V.forms[V.job(s[0]).form]; help.textContent = f.title;
        box.innerHTML = '<label><input type="radio" name="item" value="general" checked><span>General photo (no specific item)</span></label>' +
            f.items.map(function (it, i) { return '<label><input type="radio" name="item" value="' + i + '"><span>' + (i + 1) + '. ' + V.esc(it) + '</span></label>'; }).join('');
    }
    V.$$('input[name=job]').forEach(function (c) { c.addEventListener('change', step2); });
    step2();
    document.getElementById('file').addEventListener('change', function (e) {
        Array.prototype.forEach.call(e.target.files, function (f) {
            files.push(f);
            var el = document.createElement('div'); el.className = 'ph';
            el.innerHTML = '<img alt=""><small>' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + '</small>';
            el.querySelector('img').src = URL.createObjectURL(f);
            document.getElementById('thumbs').appendChild(el);
        });
        e.target.value = '';
    });
    document.getElementById('qs').addEventListener('change', function (e) {
        if (!e.target.value) return;
        var n = document.getElementById('pn'); n.value = (n.value ? n.value + '. ' : '') + e.target.value; e.target.value = '';
    });
    document.getElementById('clr').addEventListener('click', function () {
        V.$$('input[name=job]').forEach(function (c) { c.checked = false; });
        files = []; document.getElementById('thumbs').innerHTML = ''; document.getElementById('pn').value = ''; document.getElementById('msg').hidden = true; step2();
    });
    document.getElementById('sub').addEventListener('click', function () {
        var m = document.getElementById('msg'); m.hidden = false;
        if (!sel().length) { m.className = 'alert alert-error'; m.textContent = 'Step 1: select at least one job.'; return; }
        if (!files.length) { m.className = 'alert alert-error'; m.textContent = 'Step 3: choose at least one photo.'; return; }
        m.className = 'alert alert-ok'; m.textContent = files.length + ' photo(s) ready for ' + sel().join(', ') + '. Preview only: nothing was uploaded.';
    });
};
</script>
</body>
</html>
