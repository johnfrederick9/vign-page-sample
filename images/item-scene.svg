  <polyline points="98,58 112,60" fill="none" stroke="#ffffff" stroke-width="2"/>
  <!-- steps -->
  <rect x="120" y="150" width="200" height="14" fill="#b3aa98"/><rect x="100" y="164" width="220" height="16" fill="#9d9483"/>
