<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">
  <rect width="320" height="180" fill="#e9e4da"/>
  <g stroke="#d8d1c3" stroke-width="2"><line y1="30" x2="320" y2="30"/><line y1="60" x2="320" y2="60"/><line y1="90" x2="320" y2="90"/><line y1="120" x2="320" y2="120"/></g>
  <!-- door + frame -->
  <rect x="150" y="10" width="110" height="170" fill="#ffffff"/>
  <rect x="162" y="22" width="86" height="158" fill="#12306b"/>
  <rect x="174" y="36" width="62" height="48" fill="none" stroke="#1d3f86" stroke-width="5"/>
