      <stop offset="0" stop-color="#cfe0f7"/><stop offset="1" stop-color="#eef4fc"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb069"/><stop offset="1" stop-color="#4f8a3f"/>
