    <line x1="160" y1="330" x2="510" y2="330"/><line x1="160" y1="365" x2="510" y2="365"/><line x1="160" y1="400" x2="510" y2="400"/>
    <line x1="160" y1="435" x2="510" y2="435"/><line x1="160" y1="470" x2="510" y2="470"/><line x1="160" y1="505" x2="510" y2="505"/><line x1="160" y1="540" x2="510" y2="540"/>
  </g>
  <rect x="190" y="340" width="70" height="90" fill="#9db8d9" stroke="#2b3a52" stroke-width="6"/>
