  <line x1="225" y1="340" x2="225" y2="430" stroke="#2b3a52" stroke-width="4"/><line x1="445" y1="340" x2="445" y2="430" stroke="#2b3a52" stroke-width="4"/>
  <rect x="295" y="400" width="80" height="185" fill="#12306b"/>
  <circle cx="362" cy="495" r="5" fill="#f5c518"/>
  <rect x="280" y="585" width="110" height="18" fill="#b9b2a4"/><rect x="270" y="603" width="130" height="18" fill="#a59d8e"/>
